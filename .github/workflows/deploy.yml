name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 4. Build React Application (Vite)
        working-directory: frontend
        run: npm run build

      - name: 5. Prepare Deployment Package
        run: |
          mkdir -p deploy_package
          
          # Copy built React SPA files into root
          cp -r frontend/dist/* deploy_package/
          
          # Copy PHP Backend
          mkdir -p deploy_package/backend
          cp -r backend/* deploy_package/backend/
          
          # Copy Static Brand Assets (Logos, Icons, etc.)
          mkdir -p deploy_package/public_assets
          cp -r public_assets/* deploy_package/public_assets/
          
          # Copy Apache/LiteSpeed Server Configuration (.htaccess)
          cp .htaccess deploy_package/.htaccess

      - name: 6. Sync Files to Hostinger Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'domains/netraunnayan.com/public_html/' }}
          local-dir: ./deploy_package/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/backend/.env*
            **/node_modules/**
            **/backend/uploads/**
